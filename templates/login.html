<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log in — Assured Contract Farming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#F1F3EA; --ink:#202B22; --forest:#24463A; --gold:#C98A2B; --line:#D8DECB; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--paper); color:var(--ink); font-family:"Work Sans", sans-serif;
    }
    .panel {
  width:320px; background:#fff; padding:36px 34px;
  border-radius:8px; box-shadow:0 4px 24px rgba(36,70,58,0.08);
} 
    .wordmark { font-family:"Fraunces", serif; font-style:italic; font-size:20px; color:var(--forest); margin-bottom:26px; }
    label { display:block; font-size:13px; color:#3d4a3e; margin-top:16px; }
    input { width:100%; padding:9px; margin-top:5px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:14px; background:#fff; }
    button { margin-top:24px; width:100%; padding:11px; background:var(--forest); color:#fff; border:none; border-radius:4px; font-size:14px; font-family:inherit; cursor:pointer; }
    .flash { background:#fbeee2; color:#8a4a2a; border-left:3px solid #9C5B3C; padding:8px 12px; font-size:13px; margin-top:16px; }
    .link { margin-top:20px; font-size:13px; color:#5B6A5C; }
    .link a { color:var(--forest); }
  
    body { background:radial-gradient(circle at 15% 15%,#e5efe3 0,transparent 30%),linear-gradient(135deg,#f5f7f2,#eaf1e9); padding:24px; }
    .panel { width:min(440px,100%); padding:42px 40px; border:1px solid #e4ebe2; border-radius:22px; box-shadow:0 24px 70px rgba(24,61,43,.12); position:relative; overflow:hidden; }
    .panel:before { content:""; position:absolute; height:5px; inset:0 0 auto; background:linear-gradient(90deg,#174b36,#8fb17c,#d5a64b); }
    .wordmark { font-family:"Work Sans",sans-serif; font-style:normal; font-weight:750; font-size:17px; letter-spacing:-.4px; display:flex; align-items:center; gap:10px; margin-bottom:32px; }
    .wordmark:before { content:"✳"; width:36px;height:36px; display:grid;place-items:center; border-radius:11px; background:#eaf3e9;color:#1b513a;font-size:21px; }
    .panel h1 { font-family:"Work Sans",sans-serif !important; font-size:29px !important; letter-spacing:-.8px; margin-bottom:8px !important; color:#1b3528; }
    .panel h1:after { content:"Sign in to manage your farm and explore verified contract opportunities."; display:block; font-family:"Work Sans",sans-serif; font-size:13px; line-height:1.6; font-weight:400; letter-spacing:0; color:#748178; margin-top:9px; }
    label { font-weight:600; margin-top:19px; color:#43584b; }
    input { min-height:46px; padding:12px 13px; margin-top:7px; border-radius:10px; }
    button { min-height:47px; border-radius:10px; font-weight:650; }
    .link { text-align:center; color:#718078; }
    .link a { font-weight:650; text-decoration:none; }
    @media(max-width:480px){body{padding:14px}.panel{padding:36px 24px}}

</style>
</head>
<body>
  <div class="panel">
    <div class="wordmark">Assured Contract Farming</div>
    <h1 style="font-family:'Fraunces',serif; font-size:22px; margin:0;">Log in</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
    <div class="link">No account? <a href="{{ url_for('register') }}">Register here</a></div>
  </div>
</body>
</html>
